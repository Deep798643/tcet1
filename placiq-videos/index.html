<!doctype html><html><head><meta charset="utf-8"><title>Placiq Films + 60-Day Campaign</title><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{margin:0;background:#F5F2EC;color:#0F1117;font-family:system-ui,sans-serif}main{max-width:1240px;margin:0 auto;padding:40px 20px}
h1{font-size:44px;margin:0 0 6px;letter-spacing:-.03em}h2{margin:40px 0 12px}.sub{color:#5f5d58;margin:0 0 20px}
.orig{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:20px}.orig video{width:100%;border-radius:12px;background:#000}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.card{background:#fff;border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:6px}.card video{width:100%;aspect-ratio:9/16;border-radius:10px;background:#000}
.t{font-weight:700;font-size:15px}.m{font:12px monospace;color:#6b6a66}.dl{display:flex;flex-wrap:wrap;gap:6px}
.dl a,.dl button,.f button{font:12px monospace;padding:6px 10px;border-radius:999px;background:#0F1117;color:#F5F2EC;text-decoration:none;border:0;cursor:pointer}
.dl a.p{background:#3151EE}.f{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 4px}.f button.on{background:#3151EE}
.pend{aspect-ratio:9/16;border-radius:10px;background:#E9E4DA;display:flex;align-items:center;justify-content:center;font:13px monospace;color:#8A877F}
nav a{font:12px monospace;margin-right:6px;color:#3151EE}
</style></head><body><main>
<h1>Placiq video studio</h1><p class="sub">Kokoro-82M narration (local) · procedural music + SFX · real Placiq product footage. <a href="https://github.com/Deep798643/tcet1/tree/motionless-marmoset-akyf/set-up-this-codebase-for-Ed0WPD/placiq-videos">Source on GitHub</a></p>
<h2>60-day campaign <span id="cnt" class="m"></span></h2><nav id="nav"></nav><div class="f" id="filters"></div><div id="weeks"></div>
<h2>Original films (1920×1080)</h2><div class="orig" id="orig"></div>
</main><script>
const O=[['01-your-work-connected','Your Work, Connected'],['02-your-ai-forgot-again','Your AI Forgot Again'],['03-memorized-is-not-mastered','You Memorized the Code']];
document.getElementById('orig').innerHTML=O.map(([s,t])=>`<div><div class="t">${t}</div><video controls preload="none" poster="original-films/${s}/thumbnails/thumbnail.png" src="original-films/${s}/${s}_FINAL.mp4"></video><div class="dl"><a class="p" download href="original-films/${s}/${s}_FINAL.mp4">Final</a><a download href="original-films/${s}/${s}_MUSIC_ONLY.mp4">Music-only</a><a download href="original-films/${s}/audio/narration.wav">Narration</a><a download href="original-films/${s}/audio/music.wav">Music</a><a download href="original-films/${s}/audio/sfx.wav">SFX</a><a href="original-films/${s}/captions/${s}.srt">SRT</a></div></div>`).join('');
let V=[],F='All';
fetch('gallery/campaign.json?'+Date.now()).then(r=>r.json()).then(v=>{V=v;draw()});
function draw(){
 const ready=V.filter(x=>x.status==='ready_to_post').length;document.getElementById('cnt').textContent=`${ready} / 60 finished`;
 const pills=['All',...new Set(V.map(x=>x.pillar))];
 document.getElementById('filters').innerHTML=pills.map(p=>`<button class="${p===F?'on':''}" onclick="F='${p}';draw()">${p}</button>`).join('');
 const wk=d=>d>=57?'Bonus days 57-60':'Week '+Math.ceil(d/7);
 const groups={};V.filter(x=>F==='All'||x.pillar===F).forEach(x=>(groups[wk(x.day)]=groups[wk(x.day)]||[]).push(x));
 document.getElementById('nav').innerHTML=V.map(x=>`<a href="#d${x.day}">D${String(x.day).padStart(2,'0')}</a>`).join('');
 document.getElementById('weeks').innerHTML=Object.entries(groups).map(([g,xs])=>`<h3>${g}</h3><div class="grid">`+xs.map(x=>{
  const d=x.dir.replace(/^/,'');const ok=x.status==='ready_to_post';
  return `<div class="card" id="d${x.day}"><div class="t">D${String(x.day).padStart(2,'0')} · ${x.title}</div><div class="m">${x.pillar} · ${x.format} · ${ok?x.duration+'s · '+x.qa.lufs+' LUFS':'status: '+x.status}</div>`+
  (ok?`<video controls preload="none" poster="${d}/thumbnail.png" src="${d}/final.mp4"></video><div class="dl"><a class="p" download href="${d}/final.mp4">Final</a><a download href="${d}/music_only.mp4">Music-only</a><a download href="${d}/mix.wav">Mix</a><a download href="${d}/music.wav">Music</a><a download href="${d}/sfx.wav">SFX</a>${x.format!=='music'&&x.format!=='comedy'||x.qa.narration_voiced_ratio?`<a download href="${d}/narration.wav">VO</a>`:''}<a href="${d}/subtitles.srt">SRT</a><a href="${d}/storyboard.png">Board</a><a href="${d}/metadata.json">Meta</a><button onclick='navigator.clipboard.writeText(V.find(v=>v.day==${x.day}).ig);this.textContent="Copied"'>Copy caption</button></div>`:`<div class="pend">not rendered yet</div>`)+`</div>`}).join('')+'</div>').join('');
}
</script></body></html>
